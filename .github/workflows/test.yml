name: test

on:
  push:
    branches: [main]
  pull_request:
    # Includes every Dependabot PR; no actor or path filter.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Garnet Runtime Review
        id: garnet
        uses: garnet-org/action@249153cfd535f8a08c328c1ef71eeb4b1b9ac096 # v2.3.0 candidate, UNACCEPTED
        with:
          # Deliberately no api_token: exercise the OIDC exchange.
          jibril_version: v2.17.0
          debug: true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q analysis
