name: Record agent run
run-name: "ABI gh-aw pilot: ${{ inputs.agent }} / ${{ inputs.task }}"
on:
  workflow_dispatch:
    inputs:
      agent:
        type: choice
        options: [all, claude, codex, gemini]
        default: all
      task:
        type: choice
        options: [c0, t2]
        default: c0
permissions:
  contents: read
  actions: read
concurrency:
  group: abi-ghaw-pilot
  cancel-in-progress: false
jobs:
  claude:
    if: inputs.agent == 'all' || inputs.agent == 'claude'
    uses: ./.github/workflows/abi-claude.lock.yml
    with:
      task: ${{ inputs.task }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GARNET_API_TOKEN: ${{ secrets.GARNET_API_TOKEN }}
  codex:
    needs: claude
    if: always() && (inputs.agent == 'all' || inputs.agent == 'codex')
    uses: ./.github/workflows/abi-codex.lock.yml
    with:
      task: ${{ inputs.task }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GARNET_API_TOKEN: ${{ secrets.GARNET_API_TOKEN }}
  gemini:
    needs: codex
    if: always() && (inputs.agent == 'all' || inputs.agent == 'gemini')
    uses: ./.github/workflows/abi-gemini.lock.yml
    with:
      task: ${{ inputs.task }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GARNET_API_TOKEN: ${{ secrets.GARNET_API_TOKEN }}
